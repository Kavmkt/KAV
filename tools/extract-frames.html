<!doctype html>
<meta charset="utf-8">
<title>Extrair quadros do hero (mobile)</title>
<style>body{font:14px system-ui;background:#0A1633;color:#fff;padding:20px}code{color:#FFB224}</style>
<h2>Extrair quadros do vídeo do hero</h2>
<p>1) <code>node tools/frame-receiver.mjs</code> &nbsp; 2) <code>npx http-server -p 8766</code> na raiz &nbsp; 3) abra esta página e deixe a aba visível até terminar.</p>
<p id="log">aguardando…</p>
<canvas id="c" style="max-width:240px"></canvas>
<video id="v" muted playsinline preload="auto" style="display:none"></video>
<script>
// ---- Ajustes (devem casar com js/hero-frames.js, que lê assets/frames/manifest.json) ----
const SRC = '../assets/video/Untitled_Scene_10-03_00_51_11_20261002215523.mp4';
const FPS = 10;            // quadros por segundo de vídeo
const CROP = 0.40;         // fração central da largura (celular em pé mostra só o miolo do vídeo)
const QUALITY = 0.64;      // WebP
const RECEIVER = 'http://localhost:8771';

const v = document.getElementById('v'), c = document.getElementById('c'), log = document.getElementById('log');
const say = (t) => { log.textContent = t; document.title = t; };

v.src = SRC;
v.addEventListener('loadeddata', async () => {
  try { await fetch(RECEIVER + '/ping'); } catch (e) { return say('ERRO: receptor não está rodando (node tools/frame-receiver.mjs)'); }
  await fetch(RECEIVER + '/clear');
  const dur = v.duration, vw = v.videoWidth, vh = v.videoHeight;
  const cw = Math.round(vw * CROP), sx = Math.round((vw - cw) / 2);
  c.width = cw; c.height = vh;
  const ctx = c.getContext('2d');
  const count = Math.floor(dur * FPS) + 1;
  for (let i = 0; i < count; i++) {
    v.currentTime = Math.min(dur - 0.001, i / FPS);
    await new Promise((r) => { v.onseeked = r; setTimeout(r, 4000); });
    ctx.drawImage(v, sx, 0, cw, vh, 0, 0, cw, vh);
    const blob = await new Promise((r) => c.toBlob(r, 'image/webp', QUALITY));
    await fetch(`${RECEIVER}/save?name=f${String(i).padStart(4, '0')}.webp`, { method: 'POST', body: blob });
    if (i % 10 === 0) say(`quadro ${i + 1}/${count}`);
  }
  const manifest = { count, fps: FPS, width: cw, height: vh, duration: dur, ext: 'webp', pad: 4, prefix: 'f' };
  await fetch(`${RECEIVER}/save?name=manifest.json`, { method: 'POST', body: JSON.stringify(manifest) });
  say('PRONTO: ' + count + ' quadros');
});
</script>
